    {
      "@type": "Question",
      "name": "Quelle cuisine propose Chez Maman Jolie ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Chez Maman Jolie propose une cuisine africaine authentique avec des spécialités du Congo (pondu, fumbwa, madesu, makayabu), du Sénégal (yassa, mafé, thiéboudiène) et d'Afrique de l'Ouest. Tous les plats sont préparés maison avec des ingrédients frais."
      }
    },
    {
      "@type": "Question",
      "name": "Où livrez-vous ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Nous livrons à Paris et en petite couronne depuis Paris 11ème. Zone 1 (moins de 3 km) : livraison gratuite. Zone 2 (3 à 6 km) : 2,50€. Zone 3 (6 à 10 km) : 4,50€ dès 30€ de commande, sinon 6€. Commande minimum : 25€."
      }
    },
    {
      "@type": "Question",
      "name": "Comment commander ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Commandez directement par WhatsApp au 07 53 87 32 13 ou via le site. Paiement sécurisé par carte bancaire. Livraison en 30 à 50 minutes selon la zone."
      }
    },
    {
      "@type": "Question",
      "name": "Proposez-vous un service traiteur pour les événements ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Oui, Chez Maman Jolie propose un service traiteur événementiel pour mariages, anniversaires, baptêmes, repas d'entreprise et toute occasion spéciale. Contactez-nous par WhatsApp pour un devis personnalisé."
      }
    },
    {
      "@type": "Question",
      "name": "Quels sont vos horaires ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Du lundi au vendredi de 11h à 21h30, le samedi de 11h à 22h30. Fermé le dimanche."
      }
    },
    {
      "@type": "Question",
      "name": "Qu'est-ce que le pondu ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Le pondu est le plat national de la République Démocratique du Congo. Il s'agit de feuilles de manioc pilées et mijotées longuement avec de l'huile de palme, de l'oignon, de l'ail et des épices. C'est l'un de nos plats signatures."
      }
    },
    {
      "@type": "Question",
      "name": "Qu'est-ce que le yassa ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Le yassa est une spécialité sénégalaise emblématique : du poulet (ou du poisson) mariné dans du jus de citron et mijoté avec des oignons confits. Plat à la fois acidulé et fondant, servi avec du riz blanc."
      }
    }
  ]
