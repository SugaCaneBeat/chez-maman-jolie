<!--
============================================================
META TAGS À INSÉRER DANS LE <head> DE CHAQUE PAGE
============================================================
Ce fichier contient les meta tags optimisés pour la page d'accueil.
Pour les autres pages, adapter les balises title, description, og:title,
og:description, canonical et keywords selon le contenu de la page.
============================================================
-->

<!-- ========== CHARSET & VIEWPORT ========== -->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- ========== TITLE & DESCRIPTION (page d'accueil) ========== -->
<title>Chez Maman Jolie | Restaurant & Traiteur Africain à Paris 11ème</title>
<meta name="description" content="Cuisine africaine authentique à Paris 11ème : pondu, yassa, mafé, mikaté. Livraison 7j/7 à Paris et petite couronne, traiteur événementiel. Commande WhatsApp." />

<!-- ========== KEYWORDS (faible impact SEO mais bon pour la cohérence) ========== -->
<meta name="keywords" content="restaurant africain Paris, traiteur africain Paris, cuisine congolaise, cuisine sénégalaise, pondu Paris, yassa Paris, mafé Paris, livraison cuisine africaine, Paris 11ème" />

<!-- ========== LANGUE & ROBOTS ========== -->
<meta name="language" content="fr-FR" />
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
<meta name="googlebot" content="index, follow" />
<meta name="author" content="Chez Maman Jolie" />

<!-- ========== GÉOLOCALISATION ========== -->
<meta name="geo.region" content="FR-75" />
<meta name="geo.placename" content="Paris 11ème" />
<meta name="geo.position" content="48.8634;2.3789" />
<meta name="ICBM" content="48.8634, 2.3789" />

<!-- ========== CANONICAL URL ========== -->
<link rel="canonical" href="https://www.chezmamanjolie.com/" />

<!-- ========== HREFLANG (pour signaler la langue) ========== -->
<link rel="alternate" hreflang="fr-FR" href="https://www.chezmamanjolie.com/" />
<link rel="alternate" hreflang="x-default" href="https://www.chezmamanjolie.com/" />

<!-- ========== OPEN GRAPH (Facebook, LinkedIn, WhatsApp) ========== -->
